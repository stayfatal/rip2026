basePath: /api
definitions:
  web_backend_internal_app_serializer.ShardingStrategyJSON:
    properties:
      description:
        type: string
      is_deleted:
        type: boolean
      latency_coefficient:
        type: number
      photo_url:
        type: string
      reliability_coefficient:
        type: number
      strategy_id:
        type: integer
      throughput_coefficient:
        type: number
      title:
        type: string
      video:
        type: string
    type: object
  web_backend_internal_app_serializer.SignInRequest:
    properties:
      login:
        type: string
      password:
        type: string
    required:
    - login
    - password
    type: object
  web_backend_internal_app_serializer.SignUpRequest:
    properties:
      login:
        type: string
      password:
        type: string
    required:
    - login
    - password
    type: object
  web_backend_internal_app_serializer.SignUpResponse:
    properties:
      is_moderator:
        type: boolean
      login:
        type: string
    type: object
  web_backend_internal_app_serializer.StatusJSON:
    properties:
      status:
        type: string
    type: object
  web_backend_internal_app_serializer.SystemLoadJSON:
    properties:
      completed_item_count:
        type: integer
      created_at:
        type: string
      creator_login:
        type: string
      description:
        type: string
      finish_date:
        type: string
      forming_date:
        type: string
      moderator_login:
        type: string
      status:
        type: string
      system_load_id:
        type: integer
    type: object
  web_backend_internal_app_serializer.SystemLoadStrategyJSON:
    properties:
      data_volume:
        type: integer
      query_count:
        type: integer
      response_time:
        type: number
      strategy_id:
        type: integer
      system_load_id:
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
    url: http://localhost:8080
  description: API для управления заявками на системную нагрузку
  license:
    name: MIT
  title: System Load API
  version: "1.0"
paths:
  /strategies:
    get:
      description: Возвращает все стратегии или фильтрует по названию
      parameters:
      - description: Название стратегии для поиска
        in: query
        name: Title
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Список стратегий
          schema:
            items:
              $ref: '#/definitions/web_backend_internal_app_serializer.ShardingStrategyJSON'
            type: array
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получить список стратегий
      tags:
      - strategies
    post:
      consumes:
      - application/json
      description: Создает новую стратегию шардинга (с возможной загрузкой изображения/видео)
      parameters:
      - description: Данные новой стратегии
        in: body
        name: strategy
        required: true
        schema:
          $ref: '#/definitions/web_backend_internal_app_serializer.ShardingStrategyJSON'
      produces:
      - application/json
      responses:
        "201":
          description: Созданная стратегия
          schema:
            $ref: '#/definitions/web_backend_internal_app_serializer.ShardingStrategyJSON'
        "400":
          description: Неверные данные
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Создать стратегию
      tags:
      - strategies
  /strategies/{id}:
    get:
      description: Возвращает информацию о стратегии по идентификатору
      parameters:
      - description: ID стратегии
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Данные стратегии
          schema:
            $ref: '#/definitions/web_backend_internal_app_serializer.ShardingStrategyJSON'
        "400":
          description: Неверный ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Стратегия не найдена
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получить стратегию по ID
      tags:
      - strategies
  /system_load_strategies/{strategy_id}/{system_load_id}:
    delete:
      description: Удаляет связь стратегии и заявки (только черновик)
      parameters:
      - description: ID стратегии
        in: path
        name: strategy_id
        required: true
        type: integer
      - description: ID заявки
        in: path
        name: system_load_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Обновленная заявка
          schema:
            $ref: '#/definitions/web_backend_internal_app_serializer.SystemLoadJSON'
        "400":
          description: Неверные ID
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ запрещен
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Не найдено
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Удалить стратегию из заявки
      tags:
      - system_load_strategies
    put:
      consumes:
      - application/json
      description: Обновляет параметры стратегии в конкретной заявке (только черновик)
      parameters:
      - description: ID стратегии
        in: path
        name: strategy_id
        required: true
        type: integer
      - description: ID заявки
        in: path
        name: system_load_id
        required: true
        type: integer
      - description: Новые данные
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/web_backend_internal_app_serializer.SystemLoadStrategyJSON'
      produces:
      - application/json
      responses:
        "200":
          description: Обновленные данные
          schema:
            $ref: '#/definitions/web_backend_internal_app_serializer.SystemLoadStrategyJSON'
        "400":
          description: Неверные данные
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ запрещен
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Не найдено
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Изменить данные стратегии в заявке
      tags:
      - system_load_strategies
  /system_load_strategies/add/{strategy_id}:
    post:
      description: Добавляет стратегию в заявку-черновик пользователя
      parameters:
      - description: ID стратегии
        in: path
        name: strategy_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Заявка с добавленной стратегией
          schema:
            $ref: '#/definitions/web_backend_internal_app_serializer.SystemLoadJSON'
        "201":
          description: Создана новая заявка
          schema:
            $ref: '#/definitions/web_backend_internal_app_serializer.SystemLoadJSON'
        "400":
          description: Неверный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Стратегия не найдена
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Стратегия уже в заявке
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Добавить стратегию в заявку
      tags:
      - system_load_strategies
  /system_loads:
    get:
      description: Возвращает заявки с фильтрацией по датам и статусу. Создатель видит
        только свои, модератор — все.
      parameters:
      - description: Начальная дата (YYYY-MM-DD)
        in: query
        name: from-date
        type: string
      - description: Конечная дата (YYYY-MM-DD)
        in: query
        name: to-date
        type: string
      - description: Статус заявки
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Список заявок
          schema:
            items:
              $ref: '#/definitions/web_backend_internal_app_serializer.SystemLoadJSON'
            type: array
        "400":
          description: Неверный формат даты
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Не авторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Получить список заявок
      tags:
      - system_loads
  /system_loads/{id}:
    delete:
      description: Логическое удаление заявки (только черновик, только создатель)
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Заявка удалена
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Неверный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ запрещен
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Заявка не найдена
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Удалить заявку
      tags:
      - system_loads
    get:
      description: Возвращает полную информацию о заявке со стратегиями
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Данные заявки со стратегиями
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Неверный ID
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ запрещен
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Заявка не найдена
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Получить заявку по ID
      tags:
      - system_loads
    put:
      consumes:
      - application/json
      description: Обновляет данные заявки (только черновик)
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: integer
      - description: Новые данные заявки
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/web_backend_internal_app_serializer.SystemLoadJSON'
      produces:
      - application/json
      responses:
        "200":
          description: Обновленная заявка
          schema:
            $ref: '#/definitions/web_backend_internal_app_serializer.SystemLoadJSON'
        "400":
          description: Неверные данные
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ запрещен
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Заявка не найдена
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Изменить заявку
      tags:
      - system_loads
  /system_loads/{id}/finish:
    put:
      consumes:
      - application/json
      description: Изменяет статус заявки на completed/rejected
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: integer
      - description: Новый статус (completed/rejected)
        in: body
        name: status
        required: true
        schema:
          $ref: '#/definitions/web_backend_internal_app_serializer.StatusJSON'
      produces:
      - application/json
      responses:
        "200":
          description: Результат модерации
          schema:
            $ref: '#/definitions/web_backend_internal_app_serializer.SystemLoadJSON'
        "400":
          description: Неверный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ запрещен (не модератор)
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Заявка не найдена
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Завершить заявку (только модератор)
      tags:
      - system_loads
  /system_loads/{id}/form:
    put:
      description: Переводит заявку из черновика в статус "formed"
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Сформированная заявка
          schema:
            $ref: '#/definitions/web_backend_internal_app_serializer.SystemLoadJSON'
        "400":
          description: Неверный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ запрещен
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Заявка не найдена
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Сформировать заявку
      tags:
      - system_loads
  /system_loads/cart:
    get:
      description: Возвращает информацию о текущей заявке-черновике пользователя
      produces:
      - application/json
      responses:
        "200":
          description: Данные корзины
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получить корзину заявки
      tags:
      - system_loads
  /users/login:
    post:
      consumes:
      - application/json
      description: Принимает логин/пароль, возвращает JWT-токен
      parameters:
      - description: Логин и пароль
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/web_backend_internal_app_serializer.SignInRequest'
      produces:
      - application/json
      responses:
        "200":
          description: token
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Неверный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Неверный логин или пароль
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Вход (получение токена)
      tags:
      - users
  /users/logout:
    post:
      description: Добавляет токен в blacklist Redis
      produces:
      - application/json
      responses:
        "204":
          description: Токен добавлен в blacklist
        "401":
          description: Токен не предоставлен
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Выход (инвалидация токена)
      tags:
      - users
  /users/register:
    post:
      consumes:
      - application/json
      description: Регистрирует нового пользователя
      parameters:
      - description: Логин и пароль
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/web_backend_internal_app_serializer.SignUpRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Пользователь создан
          schema:
            $ref: '#/definitions/web_backend_internal_app_serializer.SignUpResponse'
        "400":
          description: Ошибка валидации
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Пользователь уже существует
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Регистрация пользователя
      tags:
      - users
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
