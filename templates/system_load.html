<html lang="ru">
    <head>
        <title>Заявка — Расчёт нагрузки</title>
        <link rel="stylesheet" href="/static/css/styles.css">
    </head>
    <body>
        <header>
            <a href="/" class="header-home">
                <img src="/static/img/logo.png" alt="ShardDB" class="header-home__icon">
            </a>
        </header>
        <div class="system-load-detail">
            <div class="system-load-detail__header-card">
                <h1 class="system-load-detail__title">Заявка на расчёт нагрузки</h1>
                <div class="system-load-detail__info">
                    <div class="system-load-detail__info-item"><strong>ID заявки:</strong> {{ .system_load_id }}</div>
                    <div class="system-load-detail__info-item"><strong>Стратегий в заявке:</strong> {{ len .items }}</div>
                </div>
            </div>

            <table class="load-table">
                <thead>
                    <tr>
                        <th class="load-table__col-photo">Изображение</th>
                        <th>Стратегия</th>
                        <th>Данные (ГБ)</th>
                        <th>Запросов/сек</th>
                        <th>Время отклика</th>
                    </tr>
                </thead>
                <tbody>
                    {{ range .items }}
                    <tr>
                        <td class="load-table__col-photo">
                            <img src="{{ $.minioUrl }}/{{ .Strategy.PhotoURL }}" alt="{{ .Strategy.Title }}">
                        </td>
                        <td>{{ .Strategy.Title }}</td>
                        <td>{{ .DataVolume }}</td>
                        <td>{{ .QueryCount }}</td>
                        <td class="load-table__col-result">{{ printf "%.1f" (num .ResponseTime) }} мс</td>
                    </tr>
                    {{ end }}
                </tbody>
            </table>

            <form method="POST" action="/system_loads/delete" style="margin-top: 24px;">
                <input type="hidden" name="system_load_id" value="{{ .system_load_id }}">
                <button type="submit" class="btn-delete">Удалить заявку</button>
            </form>
        </div>
    </body>
</html>
