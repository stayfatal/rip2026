<html lang="ru">
    <head>
        <title>{{ .strategy.Title }} — Подробная информация</title>
        <link rel="stylesheet" href="/static/css/styles.css">
    </head>
    <body>
        <header>
            <a href="/" class="header-home">
                <img src="/static/img/logo.png" alt="ShardDB" class="header-home__icon">
            </a>
        </header>
        <div class="detail-wrapper">
            <div class="detail-card">
                <div class="detail-card__video-wrap">
                    <video class="detail-card__video" controls autoplay muted loop>
                        <source src="{{ .minioUrl }}/{{ .strategy.Video }}" type="video/mp4">
                    </video>
                </div>
                <div class="detail-card__body">
                    <h1 class="detail-card__title">{{ .strategy.Title }}</h1>
                    <div class="detail-card__coefficients">
                        <span class="detail-card__badge detail-card__badge--latency">Задержка: {{ printf "%.1f" .strategy.LatencyCoefficient }}</span>
                        <span class="detail-card__badge detail-card__badge--throughput">Пропускная: {{ printf "%.1f" .strategy.ThroughputCoefficient }}</span>
                        <span class="detail-card__badge detail-card__badge--reliability">Надёжность: {{ printf "%.2f" .strategy.ReliabilityCoefficient }}</span>
                    </div>
                    <p class="detail-card__description">{{ .strategy.Description }}</p>
                    <form method="POST" action="/system_loads/add" style="margin-top: 24px;">
                        <input type="hidden" name="strategy_id" value="{{ .strategy.StrategyID }}">
                        <button type="submit" class="search-btn">Добавить в заявку</button>
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
