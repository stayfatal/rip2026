<html lang="ru">
    <head>
        <title>Стратегии шардирования — Каталог</title>
        <link rel="stylesheet" href="/static/css/styles.css">
    </head>
    <body>
        <header>
            <a href="/" class="header-home">
                <img src="/static/img/logo.png" alt="ShardDB" class="header-home__icon">
            </a>
        </header>
        <div class="toolbar">
            <form action="/" method="GET" class="search-form">
                <input type="text" name="query" class="search-input" placeholder="Поиск стратегий..." value="{{ .query }}">
                <button type="submit" class="search-btn">Найти</button>
            </form>
            {{ range .system_loads }}
            <a href="/system_loads/{{ .ID }}" class="system-load-icon" title="{{ .Title }}">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <ellipse cx="12" cy="5" rx="9" ry="3"/>
                    <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
                    <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
                </svg>
                <span class="system-load-icon__badge">{{ .StrategyCount }}</span>
            </a>
            {{ end }}
        </div>
        <div class="space">
            <div class="container">
                {{ range .strategies }}
                <a href="/strategies/{{ .ID }}" class="card" data-video="http://localhost:9000/test/{{ .Video }}">
                    <img src="http://localhost:9000/test/{{ .Image }}" alt="{{ .Title }}">
                    <div class="card__body">
                        <h2 class="card__title">{{ .Title }}</h2>
                        <div class="card__coefficients">
                            <span class="card__coeff card__coeff--latency" title="Коэффициент задержки">{{ printf "%.1f" .LatencyCoefficient }}</span>
                            <span class="card__coeff card__coeff--throughput" title="Коэффициент пропускной способности">{{ printf "%.1f" .ThroughputCoefficient }}</span>
                            <span class="card__coeff card__coeff--reliability" title="Коэффициент надёжности">{{ printf "%.2f" .ReliabilityCoefficient }}</span>
                        </div>
                    </div>
                </a>
                {{ end }}
            </div>
        </div>
    </body>
</html>
